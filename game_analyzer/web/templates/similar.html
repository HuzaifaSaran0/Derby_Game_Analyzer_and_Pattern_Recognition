{% extends "base.html" %}
{% block title %}Game Analyzer — Similar{% endblock %}
{% block page %}similar{% endblock %}
{% block content %}
<section class="similar-toolbar panel">
  <button type="button" class="btn btn-sm" data-sim-refresh>Refresh</button>
  <label class="check-label">
    <input type="checkbox" data-exact-only /> Exact only
  </label>
  <p class="similar-summary" data-sim-summary>Loading…</p>
</section>

<p class="similar-kind-banner" data-sim-kind hidden></p>
<p class="empty" data-sim-loading>Scanning finished games…</p>
<p class="empty" data-sim-empty hidden>No similar games found.</p>
<div class="similar-list" data-sim-list></div>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" class="lightbox-close" aria-label="Close">×</button>
  <img alt="" />
  <p class="lightbox-status"></p>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/similar.js?v={{ static_ver }}"></script>
{% endblock %}
